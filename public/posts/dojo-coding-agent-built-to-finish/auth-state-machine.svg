<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authentication state machine</title>
  <desc id="desc">A simple state machine showing signed out, checking session, authenticated, error, and expired states with retry and sign out transitions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#131827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 48px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .state { fill: #161d2d; stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .state-accent { fill: #211a12; stroke: #f59e0b; stroke-width: 3; filter: url(#shadow); }
      .state-error { fill: #24171b; stroke: #fb7185; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 26px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .hint { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; text-anchor: middle; }
      .edge { fill: none; stroke: #f59e0b; stroke-width: 4; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .edge-error { fill: none; stroke: #fb7185; stroke-width: 3; marker-end: url(#arrow); }
      .edge-label { font: 600 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; text-anchor: middle; paint-order: stroke; stroke: #0f1523; stroke-width: 8; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1510" cy="90" r="165" fill="#f59e0b" opacity="0.06"/>
  <circle cx="90" cy="840" r="210" fill="#38bdf8" opacity="0.04"/>

  <text x="110" y="100" class="title">A simple authentication state machine</text>
  <text x="110" y="142" class="subtitle">Every transition is explicit, testable, and visible.</text>

  <circle cx="105" cy="410" r="14" fill="#f59e0b"/>

  <rect x="180" y="325" width="270" height="150" rx="28" class="state"/>
  <text x="315" y="390" class="label">Signed out</text>
  <text x="315" y="425" class="hint">No active session</text>

  <rect x="610" y="325" width="300" height="150" rx="28" class="state-accent"/>
  <text x="760" y="390" class="label">Checking session</text>
  <text x="760" y="425" class="hint">Validate credentials</text>

  <rect x="1080" y="325" width="300" height="150" rx="28" class="state"/>
  <text x="1230" y="390" class="label">Authenticated</text>
  <text x="1230" y="425" class="hint">Access granted</text>

  <rect x="610" y="650" width="300" height="140" rx="28" class="state-error"/>
  <text x="760" y="710" class="label">Error</text>
  <text x="760" y="745" class="hint">Credentials rejected</text>

  <rect x="1080" y="650" width="300" height="140" rx="28" class="state"/>
  <text x="1230" y="710" class="label">Expired</text>
  <text x="1230" y="745" class="hint">Session is no longer valid</text>

  <path d="M120 410 H170" class="edge"/>
  <path d="M450 400 H600" class="edge"/>
  <text x="525" y="380" class="edge-label">Sign in</text>

  <path d="M910 400 H1070" class="edge"/>
  <text x="990" y="380" class="edge-label">Valid</text>

  <path d="M760 475 V640" class="edge-error"/>
  <text x="815" y="565" class="edge-label">Invalid</text>

  <path d="M650 650 C520 580 520 520 650 475" class="edge-muted"/>
  <text x="510" y="555" class="edge-label">Retry</text>

  <path d="M1230 475 V640" class="edge-muted"/>
  <text x="1295" y="565" class="edge-label">Timeout</text>

  <path d="M1080 720 C965 720 945 580 1080 450" class="edge"/>
  <text x="980" y="645" class="edge-label">Refresh</text>

  <path d="M1080 360 C980 225 520 225 450 360" class="edge-muted"/>
  <text x="760" y="225" class="edge-label">Sign out</text>

  <text x="110" y="845" class="subtitle">Dojo can turn hidden control flow into a shared visual model before changing the code.</text>
</svg>
